<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 1</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="tarjeta">
    <h2>Formulario de Notas</h2>
    <form method="POST">
      <label>Nota 1:</label>
      <input type="number" name="nota1" min="10" max="70" step="any" required>
      <label>Nota 2:</label>
      <input type="number" name="nota2" min="10" max="70" step="any" required>
      <label>Nota 3:</label>
      <input type="number" name="nota3" min="10" max="70" step="any" required>
      <label>Asistencia (%):</label>
      <input type="number" name="asistencia" min="0" max="100" step="any" required>
      <button type="submit">Enviar</button>
    </form>
    {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
    {% if promedio is not none %}
      <p>{{ promedio|round(1) }}</p>
      <p>{{ estado }}</p>
    {% endif %}
  </div>
</body>
</html>
